// Generated by updater/android.py from updater/versions.json
// and updater/adapters.json.
// Run `python3 updater/android.py check` in CI.
// Optional mediated networks: https://support.axon.ai/en/max/defold/preparing-mediated-networks/

repositories {
    google()
    mavenCentral()
    {{#applovin.bidmachine_android}}
    maven { url 'https://artifactory.bidmachine.io/bidmachine' }
    {{/applovin.bidmachine_android}}
    {{#applovin.chartboost_android}}
    maven { url 'https://cboost.jfrog.io/artifactory/chartboost-ads/' }
    {{/applovin.chartboost_android}}
    {{#applovin.maio_android}}
    maven { url 'https://imobile-maio.github.io/maven' }
    {{/applovin.maio_android}}
    {{#applovin.mintegral_android}}
    maven { url 'https://dl-maven-android.mintegral.com/repository/mbridge_android_sdk_oversea' }
    {{/applovin.mintegral_android}}
    {{#applovin.ogury_android}}
    maven { url 'https://maven.ogury.co' }
    {{/applovin.ogury_android}}
    {{#applovin.pangle_android}}
    maven { url 'https://artifact.bytedance.com/repository/pangle' }
    {{/applovin.pangle_android}}
    {{#applovin.pubmatic_android}}
    maven { url 'https://repo.pubmatic.com/artifactory/public-repos' }
    {{/applovin.pubmatic_android}}
    {{#applovin.smaato_android}}
    maven { url 'https://s3.amazonaws.com/smaato-sdk-releases/' }
    {{/applovin.smaato_android}}
    {{#applovin.verve_android}}
    maven { url 'https://verve.jfrog.io/artifactory/verve-gradle-release' }
    {{/applovin.verve_android}}
    {{#applovin.yso_android}}
    maven { url 'https://ysonetwork.s3.eu-west-3.amazonaws.com/sdk/android' }
    {{/applovin.yso_android}}
}

dependencies {
    implementation 'com.applovin:applovin-sdk:13.6.3'
    // Required by the MAX consent flow used by the example.
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'

    {{#applovin.amazon_android}}
    // Amazon Publisher Services
    implementation 'com.applovin.mediation:amazon-tam-adapter:11.3.1.0'
    implementation 'com.amazon.android:aps-sdk:11.3.1'
    {{/applovin.amazon_android}}

    {{#applovin.bidmachine_android}}
    // BidMachine
    implementation 'com.applovin.mediation:bidmachine-adapter:3.7.1.0'
    {{/applovin.bidmachine_android}}

    {{#applovin.bigo_android}}
    // BIGO Ads
    implementation 'com.applovin.mediation:bigoads-adapter:5.10.1.0'
    {{/applovin.bigo_android}}

    {{#applovin.chartboost_android}}
    // Chartboost
    implementation 'com.applovin.mediation:chartboost-adapter:9.13.0.0'
    implementation 'com.google.android.gms:play-services-base:16.1.0'
    {{/applovin.chartboost_android}}

    {{#applovin.dt_exchange_android}}
    // DT Exchange
    implementation 'com.applovin.mediation:fyber-adapter:8.4.7.0'
    {{/applovin.dt_exchange_android}}

    {{#applovin.google_android}}
    // Google Bidding and Google AdMob
    implementation 'com.applovin.mediation:google-adapter:25.4.0.0'
    {{/applovin.google_android}}

    {{#applovin.google_ad_manager_android}}
    // Google Ad Manager
    implementation 'com.applovin.mediation:google-ad-manager-adapter:25.4.0.0'
    {{/applovin.google_ad_manager_android}}

    {{#applovin.hyprmx_android}}
    // HyprMX
    implementation 'com.applovin.mediation:hyprmx-adapter:6.4.2.3'
    {{/applovin.hyprmx_android}}

    {{#applovin.inmobi_android}}
    // InMobi
    implementation 'com.applovin.mediation:inmobi-adapter:11.4.0.0'
    implementation 'com.squareup.picasso:picasso:2.8'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    {{/applovin.inmobi_android}}

    {{#applovin.ironsource_android}}
    // ironSource
    implementation 'com.applovin.mediation:ironsource-adapter:9.5.0.0.0'
    {{/applovin.ironsource_android}}

    {{#applovin.liftoff_android}}
    // Liftoff Monetize
    implementation 'com.applovin.mediation:vungle-adapter:7.7.7.1'
    {{/applovin.liftoff_android}}

    {{#applovin.line_android}}
    // LINE
    implementation 'com.applovin.mediation:line-adapter:3000.1.1.0'
    {{/applovin.line_android}}

    {{#applovin.maio_android}}
    // Maio
    implementation 'com.applovin.mediation:maio-adapter:2.0.4.0'
    {{/applovin.maio_android}}

    {{#applovin.meta_android}}
    // Meta Audience Network
    implementation 'com.applovin.mediation:facebook-adapter:6.21.0.0'
    {{/applovin.meta_android}}

    {{#applovin.mintegral_android}}
    // Mintegral
    implementation 'com.applovin.mediation:mintegral-adapter:17.1.71.0'
    {{/applovin.mintegral_android}}

    {{#applovin.mobilefuse_android}}
    // MobileFuse
    implementation 'com.applovin.mediation:mobilefuse-adapter:1.11.0.0'
    {{/applovin.mobilefuse_android}}

    {{#applovin.moloco_android}}
    // Moloco
    implementation 'com.applovin.mediation:moloco-adapter:4.11.0.0'
    {{/applovin.moloco_android}}

    {{#applovin.ogury_android}}
    // Ogury
    implementation 'com.applovin.mediation:ogury-presage-adapter:6.2.2.0'
    {{/applovin.ogury_android}}

    {{#applovin.pangle_android}}
    // Pangle
    implementation 'com.applovin.mediation:bytedance-adapter:8.2.0.4.0'
    {{/applovin.pangle_android}}

    {{#applovin.pubmatic_android}}
    // PubMatic
    implementation 'com.applovin.mediation:pubmatic-adapter:5.2.0.0'
    {{/applovin.pubmatic_android}}

    {{#applovin.smaato_android}}
    // Smaato
    implementation 'com.applovin.mediation:smaato-adapter:23.2.0.0'
    {{/applovin.smaato_android}}

    {{#applovin.unity_ads_android}}
    // Unity Ads
    implementation 'com.applovin.mediation:unityads-adapter:4.19.0.1'
    {{/applovin.unity_ads_android}}

    {{#applovin.verve_android}}
    // Verve
    implementation 'com.applovin.mediation:verve-adapter:3.9.0.1'
    {{/applovin.verve_android}}

    {{#applovin.vk_android}}
    // VK Ad Network
    implementation 'com.applovin.mediation:mytarget-adapter:5.47.1.0'
    {{/applovin.vk_android}}

    {{#applovin.yandex_android}}
    // Yandex
    implementation 'com.applovin.mediation:yandex-adapter:8.2.0.1'
    {{/applovin.yandex_android}}

    {{#applovin.yso_android}}
    // YSO Network
    implementation 'com.applovin.mediation:yso-network-adapter:1.3.9.0'
    {{/applovin.yso_android}}
}
